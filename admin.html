<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Blue Lock</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body { background:#0a0e27; color:#fff; font-family:'Segoe UI',sans-serif; padding:20px; }
.container { max-width:1400px; margin:0 auto; }
h1 { text-align:center; background:linear-gradient(90deg,#0080ff,#ff0000); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
nav { display:flex; gap:10px; margin:20px 0; flex-wrap:wrap; }
nav button { flex:1; padding:15px; background:linear-gradient(90deg,#001f3f,#ff0000); border:none; color:#fff; border-radius:10px; cursor:pointer; min-width:150px; }
.page { display:none; }
.page.active { display:block; }
table { width:100%; background:rgba(20,25,50,.8); border-radius:10px; border-collapse:collapse; }
th,td { padding:12px; text-align:left; border-bottom:1px solid #0080ff; }
button { background:#0080ff; border:none; padding:8px 15px; border-radius:5px; color:#fff; cursor:pointer; margin:2px; }
button.danger { background:#ff0000; }
button.success { background:#00ff80; }
input,textarea { width:100%; padding:10px; margin:5px 0; background:#1a1f3a; border:1px solid #0080ff; color:#fff; border-radius:5px; }
.card { background:rgba(20,25,50,.8); padding:20px; border-radius:15px; margin-bottom:15px; }
.status { padding:5px 10px; border-radius:20px; font-size:.8em; }
.status.pending{background:#ffaa00}.status.confirmed{background:#00ff80}.status.rejected{background:#ff0000}
</style>
</head>
<body>
<div class="container">
  <h1><i class="fas fa-shield-alt"></i> ADMIN PANEL</h1>
  <div id="loginBox">
    <input type="password" id="adminPass" placeholder="Mot de passe admin">
    <button onclick="loginAdmin()">Se connecter</button>
  </div>

  <div id="adminPanel" style="display:none;">
    <nav>
      <button onclick="showPage('users')"><i class="fas fa-users"></i> Users</button>
      <button onclick="showPage('exchanges')"><i class="fas fa-exchange-alt"></i> Échanges</button>
      <button onclick="showPage('purchases')"><i class="fas fa-shopping-cart"></i> Commandes</button>
      <button onclick="showPage('blogs')"><i class="fas fa-newspaper"></i> Blogs</button>
      <button onclick="showPage('settings')"><i class="fas fa-cog"></i> Paramètres</button>
    </nav>

    <div id="page-users" class="page active">
      <h2>Gestion des Users</h2>
      <button onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> Télécharger PDF</button>
      <table id="usersTable"></table>
      <h3>Ajouter des Jetons</h3>
      <input type="number" id="addUserId" placeholder="User ID">
      <input type="number" id="addAmount" placeholder="Montant">
      <button onclick="addTokens()"><i class="fas fa-plus"></i> Ajouter</button>
    </div>

    <div id="page-exchanges" class="page">
      <h2>Confirmation des Échanges</h2>
      <table id="exchangesTable"></table>
    </div>

    <div id="page-purchases" class="page">
      <h2>Commandes d'Achat</h2>
      <table id="purchasesTable"></table>
    </div>

    <div id="page-blogs" class="page">
      <h2>Ajouter un Blog</h2>
      <input type="text" id="blogTitle" placeholder="Titre">
      <input type="text" id="blogImage" placeholder="URL Image">
      <input type="text" id="blogLink" placeholder="Lien Google">
      <textarea id="blogDesc" placeholder="Description"></textarea>
      <button onclick="addBlog()"><i class="fas fa-plus"></i> Ajouter</button>
    </div>

    <div id="page-settings" class="page">
      <div class="card">
        <h3><i class="fas fa-money-bill"></i> Paiement</h3>
        <input type="text" id="payOperator" placeholder="Opérateur">
        <input type="text" id="payNumber" placeholder="Numéro">
        <input type="text" id="payHolder" placeholder="Titulaire">
        <button onclick="savePayment()">Sauvegarder Paiement</button>
      </div>

      <div class="card">
        <h3><i class="fas fa-coins"></i> Prix Jetons</h3>
        <input type="number" id="tokenAmount" placeholder="Jetons">
        <input type="number" id="tokenPrice" placeholder="Prix">
        <input type="text" id="tokenCurrency" placeholder="Devise">
        <button onclick="saveTokenRate()">Sauvegarder Prix</button>
      </div>

      <div class="card">
        <h3><i class="fas fa-image"></i> Logos Tarifs</h3>
        <div id="ratesEditor"></div>
        <button onclick="saveRates()">Sauvegarder Logos & Rates</button>
      </div>
    </div>
  </div>
</div>

<script>
const API='http://localhost:3000/api';
let adminToken='';
let settings={};

async function loginAdmin(){
  const res=await fetch(`${API}/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:'admin@blue.com',password:adminPass.value})});
  const data=await res.json();
  if(data.user.role==='admin'){
    adminToken=data.token;
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminPanel').style.display='block';
    loadUsers(); loadExchanges(); loadPurchases(); loadSettings();
  }else alert('Accès refusé');
}

async function loadUsers(){
  const res=await fetch(`${API}/admin/users`,{headers:{Authorization:adminToken}});
  const users=await res.json();
  usersTable.innerHTML='<tr><th>ID</th><th>Email</th><th>Tokens</th><th>Role</th></tr>'+
    users.map(u=>`<tr><td>${u.id}</td><td>${u.email}</td><td>${u.tokens}</td><td>${u.role}</td></tr>`).join('');
}

async function loadExchanges(){
  const res=await fetch(`${API}/admin/exchanges`,{headers:{Authorization:adminToken}});
  const exchanges=await res.json();
  exchangesTable.innerHTML='<tr><th>ID</th><th>Email</th><th>Type</th><th>UID</th><th>Statut</th><th>Action</th></tr>'+
    exchanges.map(e=>`<tr><td>${e.id}</td><td>${e.email}</td><td>${e.type}</td><td>${e.uid}</td><td><span class="status ${e.status}">${e.status}</span></td>
    <td><button class="success" onclick="setExchangeStatus(${e.id},'confirmed')">Confirmer</button>
    <button class="danger" onclick="setExchangeStatus(${e.id},'rejected')">Rejeter</button></td></tr>`).join('');
}

async function loadPurchases(){
  const res=await fetch(`${API}/admin/purchases`,{headers:{Authorization:adminToken}});
  const purchases=await res.json();
  purchasesTable.innerHTML='<tr><th>ID</th><th>User</th><th>Montant</th><th>Ref</th><th>Statut</th><th>Action</th></tr>'+
    purchases.map(p=>`<tr><td>${p.id}</td><td>${p.userId}</td><td>${p.amount}</td><td>${p.transactionMsg}</td><td><span class="status ${p.status}">${p.status}</span></td>
    <td><button class="success" onclick="setPurchaseStatus(${p.id},'confirmed')">Valider</button>
    <button class="danger" onclick="setPurchaseStatus(${p.id},'rejected')">Rejeter</button></td></tr>`).join('');
}

async function loadSettings(){
  const res=await fetch(`${API}/settings`);
  settings=await res.json();
  payOperator.value=settings.payment.operator;
  payNumber.value=settings.payment.number;
  payHolder.value=settings.payment.holder;
  tokenAmount.value=settings.tokenPrice.amount;
  tokenPrice.value=settings.tokenPrice.price;
  tokenCurrency.value=settings.tokenPrice.currency;
  
  document.getElementById('ratesEditor').innerHTML=settings.rates.map(r=>`
    <div style="border-bottom:1px solid #333;padding:10px 0;">
      <h4>${r.name}</h4>
      <input type="text" id="rate_${r.id}_logo" value="${r.logo}" placeholder="URL Logo">
      <input type="number" id="rate_${r.id}_tokens" value="${r.tokens}" placeholder="Jetons">
      <input type="number" id="rate_${r.id}_reward" value="${r.reward}" placeholder="Récompense">
      <input type="text" id="rate_${r.id}_unit" value="${r.unit}" placeholder="Unité">
    </div>
  `).join('');
}

async function setExchangeStatus(id,status){
  await fetch(`${API}/admin/exchange-status`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:adminToken},body:JSON.stringify({id,status})});
  loadExchanges();
}

async function setPurchaseStatus(id,status){
  await fetch(`${API}/admin/purchase-status`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:adminToken},body:JSON.stringify({id,status})});
  loadPurchases();
}

async function addTokens(){
  await fetch(`${API}/admin/add-tokens`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:adminToken},body:JSON.stringify({userId:parseInt(addUserId.value),amount:parseInt(addAmount.value)})});
  alert('Jetons ajoutés'); loadUsers();
}

async function addBlog(){
  await fetch(`${API}/admin/blog`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:adminToken},body:JSON.stringify({title:blogTitle.value,description:blogDesc.value,image:blogImage.value,link:blogLink.value})});
  alert('Blog ajouté');
}

async function savePayment(){
  await fetch(`${API}/admin/settings`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:adminToken},body:JSON.stringify({payment:{operator:payOperator.value,number:payNumber.value,holder:payHolder.value}})});
  alert('Sauvegardé');
}

async function saveTokenRate(){
  await fetch(`${API}/admin/settings`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:adminToken},body:JSON.stringify({tokenPrice:{amount:parseInt(tokenAmount.value),price:parseInt(tokenPrice.value),currency:tokenCurrency.value}})});
  alert('Sauvegardé');
}

async function saveRates(){
  const rates=settings.rates.map(r=>({
    id:r.id,
    name:r.name,
    logo:document.getElementById(`rate_${r.id}_logo`).value,
    tokens:parseInt(document.getElementById(`rate_${r.id}_tokens`).value),
    reward:parseInt(document.getElementById(`rate_${r.id}_reward`).value),
    unit:document.getElementById(`rate_${r.id}_unit`).value
  }));
  await fetch(`${API}/admin/settings`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:adminToken},body:JSON.stringify({rates})});
  alert('Sauvegardé');
}

async function downloadPDF(){
  window.open(`${API}/admin/download-users`,'_blank');
}

function showPage(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
}
</script>
</body>
  </html>
