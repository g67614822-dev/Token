<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin Panel - Blue Lock</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body { background: #0a0e27; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
.container { max-width: 1400px; margin: 0 auto; }
h1 { text-align: center; background: linear-gradient(90deg, #0080ff, #ff0000); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
nav { display: flex; gap: 10px; margin: 20px 0; }
nav button { flex: 1; padding: 15px; background: linear-gradient(90deg, #001f3f, #ff0000); border: none; color: #fff; border-radius: 10px; cursor: pointer; }
.menu-content { display: none; }
.menu-content.active { display: block; }
table { width: 100%; background: rgba(20, 25, 50, 0.8); border-radius: 10px; border-collapse: collapse; }
th, td { padding: 12px; text-align: left; border-bottom: 1px solid #0080ff; }
button { background: #0080ff; border: none; padding: 8px 15px; border-radius: 5px; color: #fff; cursor: pointer; margin: 2px; }
button.danger { background: #ff0000; }
button.success { background: #00ff80; }
input, textarea { width: 100%; padding: 10px; margin: 5px 0; background: #1a1f3a; border: 1px solid #0080ff; color: #fff; border-radius: 5px; }
</style>
</head>
<body>
<div class="container">
  <h1><i class="fas fa-shield-alt"></i> ADMIN PANEL</h1>
  <input type="password" id="adminPass" placeholder="Mot de passe admin">
  <button onclick="loginAdmin()">Se connecter</button>

  <div id="adminPanel" style="display: none;">
    <nav>
      <button onclick="showMenu('users')"><i class="fas fa-users"></i> Users</button>
      <button onclick="showMenu('exchanges')"><i class="fas fa-exchange-alt"></i> Échanges</button>
      <button onclick="showMenu('blogs')"><i class="fas fa-newspaper"></i> Blogs</button>
      <button onclick="showMenu('dashboard')"><i class="fas fa-chart-line"></i> Dashboard</button>
    </nav>

    <div id="users" class="menu-content active">
      <h2>Gestion des Users</h2>
      <button onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> Télécharger PDF</button>
      <table id="usersTable"></table>
      <h3>Ajouter des Jetons</h3>
      <input type="number" id="addUserId" placeholder="User ID">
      <input type="number" id="addAmount" placeholder="Montant">
      <button onclick="addTokens()"><i class="fas fa-plus"></i> Ajouter</button>
    </div>

    <div id="exchanges" class="menu-content">
      <h2>Confirmation des Échanges</h2>
      <table id="exchangesTable"></table>
    </div>

    <div id="blogs" class="menu-content">
      <h2>Ajouter un Blog</h2>
      <input type="text" id="blogTitle" placeholder="Titre">
      <input type="text" id="blogImage" placeholder="URL Image">
      <input type="text" id="blogLink" placeholder="Lien Google">
      <textarea id="blogDesc" placeholder="Description"></textarea>
      <button onclick="addBlog()"><i class="fas fa-plus"></i> Ajouter</button>
    </div>

    <div id="dashboard" class="menu-content">
      <h2>Commandes d'Achat</h2>
      <div id="purchasesList"></div>
      <h3>Modifier Paramètres</h3>
      <input type="text" id="payNumber" placeholder="Numéro paiement">
      <input type="number" id="priceAmount" placeholder="Prix">
      <button onclick="updateSettings()"><i class="fas fa-save"></i> Sauvegarder</button>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:3000/api';
let adminToken = '';

async function loginAdmin() {
  const res = await fetch(`${API}/login`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: 'admin@blue.com', password: adminPass.value })
  });
  const data = await res.json();
  if (data.user.role === 'admin') {
    adminToken = data.token;
    document.getElementById('adminPanel').style.display = 'block';
    loadUsers(); loadExchanges();
  } else alert('Accès refusé');
}

async function loadUsers() {
  const res = await fetch(`${API}/admin/users`, { headers: { Authorization: adminToken } });
  const users = await res.json();
  usersTable.innerHTML = '<tr><th>ID</th><th>Email</th><th>Tokens</th><th>Role</th></tr>' +
    users.map(u => `<tr><td>${u.id}</td><td>${u.email}</td><td>${u.tokens}</td><td>${u.role}</td></tr>`).join('');
}

async function loadExchanges() {
  const res = await fetch(`${API}/admin/exchanges`, { headers: { Authorization: adminToken } });
  const exchanges = await res.json();
  exchangesTable.innerHTML = '<tr><th>ID</th><th>Email</th><th>Type</th><th>UID</th><th>Statut</th><th>Action</th></tr>' +
    exchanges.map(e => `<tr><td>${e.id}</td><td>${e.email}</td><td>${e.type}</td><td>${e.uid}</td><td>${e.status}</td>
    <td><button class="success" onclick="setStatus(${e.id}, 'confirmed')">Confirmer</button>
    <button class="danger" onclick="setStatus(${e.id}, 'rejected')">Rejeter</button></td></tr>`).join('');
}

async function setStatus(id, status) {
  await fetch(`${API}/admin/exchange-status`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: adminToken },
    body: JSON.stringify({ id, status })
  });
  loadExchanges();
}

async function addTokens() {
  await fetch(`${API}/admin/add-tokens`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: adminToken },
    body: JSON.stringify({ userId: parseInt(addUserId.value), amount: parseInt(addAmount.value) })
  });
  alert('Jetons ajoutés');
  loadUsers();
}

async function addBlog() {
  await fetch(`${API}/admin/blog`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: adminToken },
    body: JSON.stringify({ title: blogTitle.value, description: blogDesc.value, image: blogImage.value, link: blogLink.value })
  });
  alert('Blog ajouté');
}

async function downloadPDF() {
  window.open(`${API}/admin/download-users`, '_blank');
}

function showMenu(menu) {
  document.querySelectorAll('.menu-content').forEach(m => m.classList.remove('active'));
  document.getElementById(menu).classList.add('active');
}
</script>
</body>
</html>
