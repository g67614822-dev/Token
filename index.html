<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Lock Rewards</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body { background:#0a0e27; color:#fff; padding-bottom:80px; }
header { background:linear-gradient(90deg,#001f3f,#ff0000); padding:15px; text-align:center; }
.container { padding:20px; }
.card { background:rgba(20,25,50,.8); padding:20px; border-radius:15px; border:1px solid #0080ff; margin-bottom:15px; }
input,textarea { width:100%; padding:12px; margin:10px 0; border:2px solid #0080ff; background:rgba(0,0,0,.5); color:#fff; border-radius:10px; }
button { width:100%; background:linear-gradient(90deg,#0080ff,#ff0000); border:none; padding:14px; color:#fff; font-weight:bold; border-radius:10px; cursor:pointer; }
.page { display:none; }
.page.active { display:block; }
.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:#0f1430; display:flex; justify-content:space-around; padding:10px 0; border-top:2px solid #0080ff; }
.bottom-nav a { color:#888; text-align:center; text-decoration:none; font-size:.8em; cursor:pointer; }
.bottom-nav a.active { color:#0080ff; }
.bottom-nav i { display:block; font-size:1.4em; margin-bottom:4px; }
footer { text-align:center; padding:20px; color:#666; font-size:.85em; }
.toast { position:fixed; top:20px; right:20px; left:20px; padding:15px; background:linear-gradient(90deg,#0080ff,#00ff80); border-radius:10px; z-index:1000; }
.token { font-size:2.5em; color:#00ff80; text-align:center; margin:20px 0; }
.status { display:inline-block; padding:5px 10px; border-radius:20px; font-size:.8em; }
.status.pending{background:#ffaa00}.status.confirmed{background:#00ff80}.status.rejected{background:#ff0000}
.btn-ussd { background:#00c851; display:flex; align-items:center; justify-content:center; gap:10px; }
.phone-box { display:flex; align-items:center; background:#2a2f4a; border:2px solid #3a3f5a; border-radius:12px; padding:15px; }
.phone-number { flex:1; font-size:1.2em; letter-spacing:2px; font-family:monospace; }
.copy-btn { background:#2a2f4a; border:none; padding:10px; border-radius:8px; cursor:pointer; }
.copy-btn svg { width:24px; height:24px; fill:#00c851; }
.step { color:#aaa; font-size:.9em; margin-bottom:10px; text-transform:uppercase; }
img.logo { width:60px; height:60px; object-fit:cover; border-radius:8px; margin-right:10px; }
</style>
</head>
<body>
<header><h1><i class="fas fa-futbol"></i> BLUE LOCK</h1></header>

<div id="authModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);padding:20px;z-index:100;">
  <div class="card" style="margin-top:50px;">
    <h2 id="authTitle">Connexion</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Mot de passe">
    <button onclick="login()">Se connecter</button>
    <button onclick="toggleAuth()" style="background:#333;margin-top:10px;">Créer un compte</button>
  </div>
</div>

<div id="app" style="display:none;">
  <div id="page-accueil" class="page active"><div class="container"><div class="card"><h2><i class="fas fa-newspaper"></i> Nouvelles</h2><div id="blogList"></div></div></div></div>
  <div id="page-defi" class="page"><div class="container"><div class="card" style="text-align:center;"><h2>Défi Quotidien</h2><p>20 jetons chaque jour</p><div class="token"><span id="tokens">0</span> jetons</div><button onclick="claim()"><i class="fas fa-gift"></i> CLAIM 20 JETONS</button></div></div></div>
  <div id="page-echange" class="page"><div class="container" id="exchangeList"></div></div>
  <div id="page-historique" class="page"><div class="container" id="historyList"></div></div>
  <div id="page-vente" class="page"><div class="container"><div class="price" id="priceInfo" style="text-align:center;color:#00ff80;font-size:1.3em;margin-bottom:20px;"></div>
    <div class="card"><div class="step">1. ENVOYER LE PAIEMENT :</div>
      <button class="btn-ussd" onclick="openUSSD()"><i class="fas fa-bolt"></i> Envoyer (USSD)</button>
      <div class="phone-box"><div class="phone-number" id="phoneNumber"></div>
        <button class="copy-btn" onclick="copyPhone()"><svg viewBox="0 0 24 24"><path d="M16 1H8C6.34 1 5 2.34 5 4v12h2V4h9V1zm3 4H11c-1.1 0-2.9-2 2v12c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 14H11V7h8v12z"/></svg></button>
      </div>
    </div>
    <div class="card"><div class="step">2. RÉFÉRENCE DE TRANSACTION :</div>
      <input type="text" id="transactionMsg" placeholder="Ex : Ref: 5443017XX">
      <button onclick="purchase()">Confirmer l'achat</button>
    </div>
  </div>
</div>

<div class="bottom-nav" id="nav" style="display:none;">
  <a onclick="showPage('accueil')" class="active"><i class="fas fa-home"></i>Accueil</a>
  <a onclick="showPage('defi')"><i class="fas fa-trophy"></i>Défi</a>
  <a onclick="showPage('echange')"><i class="fas fa-exchange-alt"></i>Échange</a>
  <a onclick="showPage('historique')"><i class="fas fa-history"></i>Historique</a>
  <a onclick="showPage('vente')"><i class="fas fa-shopping-cart"></i>Acheter</a>
</div>

<footer>Tsilavina©2026 verified</footer>

<script>
const API='http://localhost:3000/api';
let token=localStorage.getItem('token');
let settings={};
let currentUser={};
let PHONE='';

function showPage(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.bottom-nav a').forEach(a=>a.classList.remove('active'));
  event.target.closest('a').classList.add('active');
  if(page==='defi') loadUser();
  if(page==='historique') loadHistory();
  if(page==='vente') loadSettings();
  if(page==='echange') loadExchangeRates();
}

async function init(){
  if(token){
    const res=await fetch(`${API}/me`,{headers:{Authorization:token}});
    if(res.ok){
      currentUser=await res.json();
      document.getElementById('authModal').style.display='none';
      document.getElementById('app').style.display='block';
      document.getElementById('nav').style.display='flex';
      loadBlogs(); loadSettings();
    }else{localStorage.removeItem('token');token=null;}
  }
  if(!token) document.getElementById('authModal').style.display='block';
}

async function loadBlogs(){
  const res=await fetch(`${API}/blogs`);
  const blogs=await res.json();
  document.getElementById('blogList').innerHTML=blogs.map(b=>`
    <div class="card">
      <img src="${b.image}" style="width:100%;border-radius:10px;margin-bottom:10px;">
      <h3>${b.title}</h3>
      <p>${b.description}</p>
      <a href="${b.link}" target="_blank"><button style="margin-top:10px;">Lire</button></a>
    </div>
  `).join('')||'<p>Aucune news</p>';
}

async function login(){
  const res=await fetch(`${API}/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});
  const data=await res.json();
  if(data.token){token=data.token;localStorage.setItem('token',token);init();}else showToast(data.error);
}

async function register(){
  const res=await fetch(`${API}/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});
  const data=await res.json();
  if(data.token){token=data.token;localStorage.setItem('token',token);init();}else showToast(data.error);
}

let isLogin=true;
function toggleAuth(){
  isLogin=!isLogin;
  document.getElementById('authTitle').textContent=isLogin?'Connexion':'Inscription';
  document.querySelector('#authModal button').onclick=isLogin?login:register;
  document.querySelector('#authModal button:nth-child(4)').textContent=isLogin?'Créer un compte':'Déjà un compte';
}

async function loadUser(){
  const res=await fetch(`${API}/me`,{headers:{Authorization:token}});
  currentUser=await res.json();
  document.getElementById('tokens').textContent=currentUser.tokens;
}

async function claim(){
  const res=await fetch(`${API}/claim-daily`,{method:'POST',headers:{Authorization:token}});
  const data=await res.json();
  showToast(data.message||data.error);
  loadUser();
}

async function loadExchangeRates(){
  const res=await fetch(`${API}/settings`);
  settings=await res.json();
  document.getElementById('exchangeList').innerHTML=settings.rates.map(r=>`
    <div class="card">
      <img src="${r.logo}" class="logo" onerror="this.src='https://via.placeholder.com/60'">
      <h3>${r.tokens} Jetons = ${r.reward} ${r.unit} ${r.name}</h3>
      <input type="text" id="${r.id}Uid" placeholder="UID ${r.name}">
      <input type="text" id="${r.id}Pseudo" placeholder="Pseudo">
      <button onclick="exchange('${r.id}')">Confirmer</button>
    </div>
  `).join('');
}

async function exchange(type){
  const uid=document.getElementById(type+'Uid').value;
  const pseudo=document.getElementById(type+'Pseudo').value;
  const res=await fetch(`${API}/exchange`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:token},body:JSON.stringify({type,uid,pseudo})});
  const data=await res.json();
  showToast(data.message||data.error);
  loadUser();
}

async function loadHistory(){
  const res=await fetch(`${API}/admin/exchanges`,{headers:{Authorization:token}});
  const data=await res.json();
  const myExchanges=data.filter(e=>e.userId==currentUser.id);
  document.getElementById('historyList').innerHTML=myExchanges.map(e=>`
    <div class="card">
      <h4>${e.type.toUpperCase()}</h4>
      <p>UID: ${e.uid} | Pseudo: ${e.pseudo}</p>
      <p>Date: ${new Date(e.date).toLocaleDateString()}</p>
      <span class="status ${e.status}">${e.status}</span>
    </div>
  `).join('')||'<p>Aucun échange</p>';
}

async function loadSettings(){
  const res=await fetch(`${API}/settings`);
  settings=await res.json();
  const p=settings.payment;
  document.getElementById('priceInfo').textContent=`${settings.tokenPrice.amount} Jetons = ${settings.tokenPrice.price}${settings.tokenPrice.currency}`;
  document.getElementById('phoneNumber').textContent=p.number.replace(/(.{3})/g,'$1 ').trim();
  PHONE=p.number.replace(/\s/g,'');
}

function openUSSD(){
  const amount=prompt('Montant à envoyer:');
  if(amount) window.location.href=`tel:*111*1*1*${PHONE}*${amount}#`;
}

function copyPhone(){
  navigator.clipboard.writeText(document.getElementById('phoneNumber').textContent);
  showToast('Numéro copié!');
}

async function purchase(){
  if(!transactionMsg.value){showToast('Mets la référence');return;}
  const res=await fetch(`${API}/purchase`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:token},body:JSON.stringify({amount:settings.tokenPrice.amount,transactionMsg:transactionMsg.value,method:settings.payment.operator})});
  const data=await res.json();
  showToast(data.message);
  if(res.ok) transactionMsg.value='';
}

function showToast(msg){
  const t=document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

init();
</script>
</body>
  </html>
